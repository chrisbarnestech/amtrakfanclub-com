<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amtrak Fan Club</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            text-align: center;
        }
        header {
            background: linear-gradient(to bottom, #FF0000 33%, #FFFFFF 33%, #FFFFFF 66%, #0000FF 66%);
            padding: 20px;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .logo {
            background-color: #0000FF;
            color: white;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            border: 5px solid #FF0000;
            position: absolute;
            left: 20px;
        }
        h1 {
            margin: 0;
            font-size: 36px;
            text-transform: uppercase;
        }
        main {
            padding: 50px 20px;
        }
        .tagline {
            font-size: 24px;
            color: #555;
            margin-bottom: 30px;
        }
        footer {
            background-color: #f1f1f1;
            padding: 20px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .social-links a {
            margin: 0 10px;
            text-decoration: none;
            color: #0000FF;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">AFC</div>
        <h1>Amtrak Fan Club</h1>
    </header>

    <main>
        <div class="tagline">For the fans of Amtrak</div>
        <p>Welcome to the ultimate community for Amtrak enthusiasts. Follow on social media to share you story!</p>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://bsky.app/profile/amtrakfanclub.com" target="_blank">Bluesky</a>
            <a href="https://mastodon.social/@amtrakfanclub_com" target="_blank">Mastodon</a>
            <a href="https://x.com/amtrakfanclub" target="_blank">X</a>
        </div>
    </footer>

</body>
</html>
